<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="128" y1="320" x2="384" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CCFBF1"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CCFBF1"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="256" y1="100" x2="256" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0A0A0A" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGrad)"/>

  <!-- Subtle inner border -->
  <rect x="24" y="24" width="464" height="464" rx="88" ry="88" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Bridge arch -->
  <g filter="shadow">
    <!-- Main arch -->
    <path d="M100 360 Q256 240 412 360" stroke="url(#bridgeGrad)" stroke-width="14" stroke-linecap="round" fill="none"/>

    <!-- Bridge deck -->
    <line x1="80" y1="360" x2="432" y2="360" stroke="url(#bridgeGrad)" stroke-width="10" stroke-linecap="round"/>

    <!-- Bridge pillars -->
    <line x1="156" y1="360" x2="156" y2="400" stroke="#CCFBF1" stroke-width="8" stroke-linecap="round"/>
    <line x1="256" y1="360" x2="256" y2="416" stroke="#CCFBF1" stroke-width="8" stroke-linecap="round"/>
    <line x1="356" y1="360" x2="356" y2="400" stroke="#CCFBF1" stroke-width="8" stroke-linecap="round"/>

    <!-- Bridge cable lines -->
    <line x1="156" y1="310" x2="156" y2="360" stroke="#CCFBF1" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>
    <line x1="206" y1="293" x2="206" y2="360" stroke="#CCFBF1" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>
    <line x1="306" y1="293" x2="306" y2="360" stroke="#CCFBF1" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>
    <line x1="356" y1="310" x2="356" y2="360" stroke="#CCFBF1" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Medical cross -->
  <g filter="glow">
    <!-- Horizontal bar -->
    <rect x="196" y="136" width="120" height="48" rx="10" fill="url(#crossGrad)"/>
    <!-- Vertical bar -->
    <rect x="232" y="100" width="48" height="120" rx="10" fill="url(#crossGrad)"/>
  </g>

  <!-- Pulse/heartbeat line through the cross -->
  <polyline points="200,160 224,160 238,130 256,190 274,130 288,160 312,160"
    stroke="#0F766E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7"/>

  <!-- Small connection dots on bridge -->
  <circle cx="100" cy="360" r="6" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="412" cy="360" r="6" fill="#FFFFFF" opacity="0.8"/>
</svg>
